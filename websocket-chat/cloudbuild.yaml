# Google Cloud Build configuration for WebSocket Chat Server
steps:
  # Build standalone websocket-chat with official Gradle builder
  - name: 'gcr.io/cloud-builders/gradle'
    dir: 'websocket-chat'
    args: ['clean', 'shadowJar', '--no-daemon']

  # Build Docker image using Cloud Build's automatic Docker build
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'websocket-chat'
    args:
      - 'build'
      - '-t'
      - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/websocket-chat/websocket-chat:$BUILD_ID'
      - '-t'
      - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/websocket-chat/websocket-chat:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Deploy to Cloud Run with dedicated service account and WebSocket timeout
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'websocket-chat'
      - '--image'
      - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/websocket-chat/websocket-chat:$BUILD_ID'
      - '--region'
      - 'asia-northeast3'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '2'
      - '--max-instances'
      - '5'
      - '--timeout'
      - '3600'
      - '--service-account'
      - 'websocket-chat-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--revision-suffix'
      - '$BUILD_ID'
      - '--set-env-vars'
      - 'JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0'

# Store images in Artifact Registry (not Container Registry)
images:
  - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/websocket-chat/websocket-chat:$BUILD_ID'
  - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/websocket-chat/websocket-chat:latest'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'  # Using valid machine type

# Build timeout
timeout: '600s'